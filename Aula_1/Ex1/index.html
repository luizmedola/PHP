<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <title>Formulário Básico</title>
</head>

<body>
    <form action="action.php" method="post">

        <input type="text" name="nome" placeholder="Digite seu Nome"><br><br>

        <input type="number" name="idade" placeholder="Informe sua idade"><br><br>

        <input type="number" name="rg" placeholder="Informe seu RG"><br><br>

        <input type="number" name="cpf" placeholder="Informe seu CPF"><br><br>

        <input type="email" name="email" placeholder="Informe seu email"><br><br>

        <input type="date" name="data" placeholder="Informe a Data"><br><br>

        <b>Informe a época do ano</b><br>
        <input type="checkbox" name="estacao[]" value="Verão"> Verão<br>
        <input type="checkbox" name="estacao[]" value="Outono"> Outono<br>
        <input type="checkbox" name="estacao[]" value="Inverno"> Inverno<br>
        <input type="checkbox" name="estacao[]" value="Primavera"> Primavera<br><br>

        <b>Informe seu sexo</b><br>
        <input type="radio" name="sexo" value="Masculino"> Masculino<br>
        <input type="radio" name="sexo" value="Feminino"> Feminino<br><br>

        <input type="text" name="cor" placeholder="Digite sua cor favorita"><br><br>

        <input type="submit" value="Enviar">
    </form>
</body>

</html>
